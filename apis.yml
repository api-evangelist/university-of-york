  - aid: university-of-york:research-portal-oai-pmh
    name: University of York Research Portal OAI-PMH
    x-operator: institution
    description: >-
      OAI-PMH 2.0 harvesting on the University's own registrable domain. The Identify response
      names the repository "The University of York", gives adminEmail pure-support@york.ac.uk and
      an earliest datestamp of 2014-10-14. All six verbs are live. Five metadata formats are
      served — mods, xmetadiss, nl_didl, oai_dc and qdc — and the MODS records carry typed ORCID
      iDs and DOIs. Sets cover persons, publications, publications with files, and publications by
      year. The deletedRecord policy is "no", so incremental harvesting cannot detect withdrawals.
      The underlying product is Elsevier Pure; its proprietary REST API is a separate, tenant
      surface and its contract is deliberately not saved here.
    humanURL: https://pure.york.ac.uk/portal/
    baseURL: https://pure.york.ac.uk/ws/oai
    tags:
