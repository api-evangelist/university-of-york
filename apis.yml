aid: university-of-york
name: University of York
description: >-
  The University of York is a public research university in York, United Kingdom,
  ranked #184 in the QS World University Rankings 2025 and a member of the Russell
  Group. The university does not operate a dedicated public developer portal with
  documented, self-service APIs. Its confirmed programmatic surface is largely
  standards-based and library/research oriented: OAI-PMH metadata harvesting via the
  shared White Rose Research Online and White Rose eTheses Online EPrints repositories,
  and an Ex Libris Primo/Alma library discovery layer (YorSearch). The institution
  maintains a verified GitHub organization focused on internal faculty/IT engineering
  tooling rather than externally published APIs.
