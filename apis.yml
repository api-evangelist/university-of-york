  - aid: university-of-york:pure-web-services
    name: Elsevier Pure Web Services (University of York tenant)
    x-operator: tenant
    description: >-
      The Elsevier Pure REST Web Service running on the University of York's tenant host. The
      documentation index answers without a key and the versioned API serves a 1.1 MB OpenAPI
      document, but the API itself returns 401 to an unauthenticated caller and keys are issued by
      the institution's Pure administrators rather than self-service. This is York's research
      information — and Elsevier's contract. The vendor specification is deliberately NOT saved
      under this institution's slug; that misattribution is exactly what this pipeline exists to
      prevent. What IS saved is the OAI-PMH surface above, which is protocol-standard and
      self-identifies as the University of York.
