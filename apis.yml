description: >-
  The University of York is a public research university in York, United Kingdom, and a member of
  the Russell Group. It operates no central developer portal, no API gateway, no self-service key
  issuance and no documented course, timetable or student-information API — and this profile says
  so rather than padding it. What it does operate, found by probing rather than by reading claims,
  is a genuinely first-party machine-readable estate around its digitised collections: a keyless
  JSON search API over 415,165 archive, library and cultural-heritage records at
  discover.york.ac.uk, a IIIF Image API 3.0 deployment at compliance level 2, IIIF Presentation
  API 3.0 manifests and canvases, all under the University's own ARK namespace (NAAN 36941); plus
  a live OAI-PMH 2.0 harvesting endpoint on its own research-portal host that emits ORCID iDs in
  its MODS records, and a Shibboleth SAML 2.0 identity provider. Everything else that looks like a
  York API is someone else's contract running under York's name: the Elsevier Pure REST Web
  Service, Ex Libris Primo/Alma discovery (YorSearch), and the White Rose Research Online and
  White Rose eTheses Online EPrints repositories shared with Leeds and Sheffield. Those are
  recorded here as tenant relationships, which they are, and not as York engineering, which they
  are not.
