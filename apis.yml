  - aid: university-of-york:digital-collections-iiif
    name: University of York Digital Collections IIIF APIs
    x-operator: institution
    description: >-
      The University of York serves its digitised material through two IIIF specifications on its
      own host: IIIF Image API 3.0 at compliance level 2 (the served info.json declares
      "profile": "level2", "type": "ImageService3" and its own extraFeatures, extraFormats and
      extraQualities), and IIIF Presentation API 3.0 manifests and canvases. Identifiers are ARKs
      under the University's Name Assigning Authority Number 36941. Keyless and CORS open. The
      IIIF Collection endpoint is not deployed, so there is no machine-readable entry point that
      enumerates the collections — a harvester has to start from the search API.
