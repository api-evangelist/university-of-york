  - aid: university-of-york:yorsearch-primo
    name: YorSearch Library Discovery (Ex Libris Primo)
    description: >-
      YorSearch is the University of York library discovery service, built on the Ex
      Libris Primo platform with an Alma library services backend (view id
      44YORK-NUI). Primo exposes programmatic discovery via its REST and PNX/X-Services
      interfaces; access is not openly documented by the university and typically
      requires institutional credentials or an Ex Libris API key. The discovery UI is
      confirmed live (HTTP 200).
    humanURL: https://www.york.ac.uk/library/resources/yorsearch-help/
    tags: [ Library, Discovery, Primo, Alma, Ex Libris, Catalogue ]
