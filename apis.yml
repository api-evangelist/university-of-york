  detail: >-
    The University of York does operate real, first-party, machine-readable APIs and they were
    found and verified by live probe on 2026-08-30, not inferred from links. Three contracts are
    saved: a keyless Elasticsearch-backed search API at discover.york.ac.uk/api/search-simple and
    /api/search over 415,165 digital-collections records; IIIF Image API 3.0 (info.json declares
    profile level2) and IIIF Presentation API 3.0 manifests and canvases on the same host; and
    OAI-PMH 2.0 at pure.york.ac.uk/ws/oai, whose Identify response names the repository "The
    University of York" with adminEmail pure-support@york.ac.uk, and whose MODS records carry
    typed ORCID iDs. The footprint is nonetheless narrow and undocumented: York publishes no
    OpenAPI, no developer portal, no changelog, no licence and no terms for any of it, and every
    field in this repository's contracts was measured rather than read. No course, timetable,
    campus-life, transit or open-data API was found — data.york.ac.uk, courses.york.ac.uk,
    sis.york.ac.uk, opendata.york.ac.uk and developer(s).york.ac.uk do not resolve at all.
    api.york.ac.uk DOES resolve and serves the University's own branded "403 local" page, an
    institution-operated API host restricted to the campus network; that is a real internal estate
    we cannot see, and it is recorded rather than counted. The library discovery layer and the
    research repositories are real institutional facts but vendor-operated, and are recorded as
    tenant. One route referenced by the site's own JavaScript, /api/annotations/{manifest}/{canvas},
    returns a 200 carrying the HTML 404 shell and is NOT deployed — it was deliberately excluded.
