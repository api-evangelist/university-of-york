apis:
  - aid: university-of-york:digital-collections-search
    name: University of York Digital Collections Search API
    x-operator: institution
    description: >-
      The keyless JSON search interface behind discover.york.ac.uk, the University of York's
      Digital Collections. Two live endpoints — /api/search-simple, which the public search page
      calls, and /api/search, which returns a different aggregation set — query an Elasticsearch
      index of 415,165 records drawn from the University Library, the Borthwick Institute for
      Archives and cultural-heritage partners. Faceted by creator, type, work type, collection and
      by collection-specific families for the York Cause Papers and archival records. No key, no
      registration, CORS open to any origin. York publishes no documentation for it; this contract
      was written from live probes and from the request construction in the site's own JavaScript.
    humanURL: https://discover.york.ac.uk/
    baseURL: https://discover.york.ac.uk
    tags:
