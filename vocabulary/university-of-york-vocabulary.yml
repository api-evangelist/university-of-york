# authorship: generated by API Evangelist from live probes of the operator's own endpoints.
# The document is ours; the facts in it were measured, not claimed. `method: probed` below
# records HOW it was obtained; this header records WHO wrote it. An unmarked artifact would
# be credited to the institution as though they published it, and they did not.
vocabulary:
  name: University of York Programmable Surface Vocabulary
  generated: '2026-08-30'
  method: derived
  source:
    - openapi/university-of-york-digital-collections-search-openapi.yml
    - openapi/university-of-york-digital-collections-iiif-openapi.yml
    - openapi/university-of-york-research-portal-oai-pmh-openapi.yml
  description: >-
    Terms actually used by the University of York's three institution-operated API surfaces:
    the Digital Collections search API, the IIIF Image and Presentation APIs, and the OAI-PMH 2.0
    harvesting endpoint on the University's research portal. Every term below is drawn from a live
    response captured on 2026-08-30, not from the specifications in the abstract. This file
    REPLACES a previous vocabulary that described the White Rose EPrints consortium repositories —
    a shared, consortium-operated surface that is no longer attributed to this institution.
  version: '2.0.0'
  terms:
    - term: ark
      definition: >-
        Archival Resource Key persistent identifier. The University of York's Name Assigning
        Authority Number is 36941; every digital-collections item is identified as
        ark:/36941/{collection}/objects/{object}.
      tags: [identifier, digital-collections, ark]
    - term: naan
      definition: ARK Name Assigning Authority Number. 36941 for the University of York.
      tags: [identifier, ark]
    - term: discover-index
      definition: >-
        The Elasticsearch index name returned in every search hit's _index field. 415,165 documents
        at the time of profiling.
      tags: [search, elasticsearch]
    - term: manifest
      definition: >-
        IIIF Presentation API 3.0 Manifest — the description of one digitised object and its
        canvases. Also appears as a value of the search index's `type` field.
      tags: [iiif, presentation, digital-collections]
    - term: canvas
      definition: IIIF Presentation API 3.0 Canvas — one addressable view within a manifest, served independently at /presentation/3/canvas/{id}.
      tags: [iiif, presentation]
    - term: ImageService3
      definition: The type declared by the IIIF Image API 3.0 information document served at /iiif/3/{ark}/info.json.
      tags: [iiif, image]
    - term: level2
      definition: >-
        The IIIF Image API 3.0 compliance level this deployment declares — arbitrary regions,
        sizes, rotation and quality transformations are supported.
      tags: [iiif, image, conformance]
    - term: extraFeatures
      definition: >-
        IIIF Image API 3.0 capabilities declared beyond the compliance level. This deployment
        declares canonicalLinkHeader, mirroring, profileLinkHeader, rotationArbitrary,
        sizeByDistortedWh, sizeByForcedWh, sizeByWhListed and sizeUpscaling.
      tags: [iiif, image, capability]
    - term: ui_redirect_link
      definition: >-
        Site-relative viewer link on a search hit, carrying manifest and canvas query parameters.
        A UI-shaped field in an otherwise data-shaped payload — a signal that this API was built
        for the University's own site rather than for third-party consumers.
      tags: [search, coupling]
    - term: 'aggs_ prefix'
      definition: >-
        Prefix on the search index's facetable fields (aggs_creator, aggs_type, aggs_rights and the
        collection-specific aggs_cp_* and aggs_ar_* families).
      tags: [search, faceting]
    - term: 'aggs_cp_ family'
      definition: >-
        Facets specific to the York Cause Papers collection — court, case, outcome, witnesses,
        parties mentioned, places. Church-court records from the Borthwick Institute for Archives.
      tags: [search, archives, cause-papers]
    - term: 'aggs_ar_ family'
      definition: Facets specific to archival records — section, language, people, places, groups, dates, referenced_by.
      tags: [search, archives]
    - term: borthwick_catalogue_reference_code
      definition: Reference code linking a digital object to its entry in the Borthwick Institute for Archives catalogue.
      tags: [archives, identifier]
    - term: verb
      definition: >-
        Required OAI-PMH 2.0 request argument selecting the protocol operation. All six —
        Identify, ListMetadataFormats, ListSets, ListIdentifiers, ListRecords, GetRecord — are
        live on the University's endpoint.
      tags: [oai-pmh, parameter]
    - term: setSpec
      definition: >-
        OAI-PMH set identifier. This deployment exposes persons:all, publications:all,
        publications:withFiles and per-year sets publications:year{YYYY}.
      tags: [oai-pmh, harvesting]
    - term: metadataPrefix
      definition: >-
        OAI-PMH metadata format selector. This deployment serves exactly five: mods, xmetadiss,
        nl_didl, oai_dc and qdc.
      tags: [oai-pmh, metadata]
    - term: oai_dc
      definition: Simple Dublin Core, the OAI-PMH mandatory baseline metadata format.
      tags: [oai-pmh, dublin-core]
    - term: mods
      definition: >-
        Metadata Object Description Schema 3.8. The only format on this endpoint that carries ORCID
        iDs (mods:nameIdentifier type="orcid") and DOIs (mods:identifier type="doi").
      tags: [oai-pmh, mods, orcid]
    - term: deletedRecord
      definition: >-
        OAI-PMH policy declaring whether withdrawals are tombstoned. This deployment declares "no",
        so incremental harvesting cannot detect removals.
      tags: [oai-pmh, harvesting, constraint]
    - term: 'OAI identifier syntax'
      definition: >-
        This deployment's identifier form is oai:https://pure.york.ac.uk/:{entity}/{uuid} where
        entity is publications or persons — an unusual construction that embeds a URL inside the
        OAI identifier.
      tags: [oai-pmh, identifier]
    - term: tenant
      definition: >-
        An institution-specific deployment of a vendor platform. York's Elsevier Pure REST API,
        Ex Libris Primo discovery layer and the White Rose EPrints consortium repositories are all
        tenant surfaces: York's data, someone else's contract.
      tags: [operator, attribution]
