# authorship: generated by API Evangelist from live probes of the operator's own endpoints.
# The document is ours; the facts in it were measured, not claimed. `method: probed` below
# records HOW it was obtained; this header records WHO wrote it. An unmarked artifact would
# be credited to the institution as though they published it, and they did not.
specification: API Commons Errors
specificationVersion: '0.1'
provider: University of York
providerId: university-of-york
generated: '2026-08-30'
method: probed
description: >-
  Error semantics observed on the University of York's institution-operated surfaces. Every entry
  below was produced by actually sending the failing request on 2026-08-30 and reading what came
  back. No error model is published by the University; this is measurement, not documentation.
sources:
  - https://discover.york.ac.uk/api/search-simple?q=york&size=abc
  - https://discover.york.ac.uk/iiif/3/ark:/36941/nope/objects/nope/info.json
  - https://pure.york.ac.uk/ws/oai?verb=BadVerb

surfaces:
  - name: University of York Digital Collections Search API
    contract: openapi/university-of-york-digital-collections-search-openapi.yml
    media_type: application/json
    model: 'flat object with a single "error" string; the message is the underlying Elasticsearch exception, passed through unmodified'
    problem_details_rfc9457: false
    errors:
      - status: 400
        trigger: 'size=abc'
        body: '{"error":"parsing_exception: [parsing_exception] Reason: Unknown key for a VALUE_NULL in [size]."}'
        note: >-
          The search engine's internal exception text is exposed to the caller. It is machine-parsable
          and honest, but it leaks the backing store's identity and is not a stable contract.
      - status: 200
        trigger: 'size=0, or a query matching nothing'
        body: 'normal envelope with hits.total.value = 0 and empty aggregation buckets'
        note: An empty result is a 200, not a 404. Correct, and worth stating.

  - name: University of York Digital Collections IIIF APIs
    contract: openapi/university-of-york-digital-collections-iiif-openapi.yml
    media_type: 'application/xml (errors), text/plain (malformed image requests)'
    model: object-store and gateway errors, surfaced without translation into IIIF error semantics
    problem_details_rfc9457: false
    errors:
      - status: 403
        trigger: unknown Image API identifier
        body: '<Error><Code>AccessDenied</Code><Message>Access Denied</Message></Error>'
        note: >-
          A missing image is reported as 403 AccessDenied by the object store rather than as 404.
          A client cannot distinguish "does not exist" from "not permitted".
      - status: 400
        trigger: 'malformed image request parameters, e.g. size "!200,200" in a position it does not accept'
        body: text/plain
      - status: 403
        trigger: '/presentation/3/collection'
        note: The IIIF Collection endpoint is not deployed; it fails as an access error rather than a 404.
      - status: 302
        trigger: '/iiif/3/{ark}/manifest'
        note: 'Redirects with a relative, unresolvable Location ("ark:/36941/13192/manifest/info.json"). A broken redirect, reported as observed.'

  - name: University of York Research Portal OAI-PMH
    contract: openapi/university-of-york-research-portal-oai-pmh-openapi.yml
    media_type: application/xml
    model: OAI-PMH 2.0 protocol errors returned inside a HTTP 200 response
    problem_details_rfc9457: false
    errors:
      - status: 200
        code: badVerb
        trigger: 'verb=BadVerb'
        body: '<error code="badVerb">Value of the verb argument is not a legal OAI-PMH verb, the verb argument is missing, or the verb argument is repeated.</error>'
      - status: 200
        code: badArgument
        trigger: 'verb=GetRecord&metadataPrefix=oai_dc with no identifier'
        body: '<error code="badArgument">The request includes illegal arguments or is missing required arguments. identifier is required.</error>'
    note: >-
      HTTP 200 on a protocol error is correct OAI-PMH behaviour and is recorded so that an agent
      reading this repository does not treat status code alone as success.

soft_failures_to_watch:
  - url: https://discover.york.ac.uk/api/annotations/{manifestId}/{canvasId}
    observed_status: 200
    reality: >-
      Returns the site's Gatsby HTML 404 shell, not JSON. The route is referenced by the site's own
      JavaScript bundle but is NOT deployed. It is excluded from the IIIF contract for exactly this
      reason; a status-code-only check would have credited it.
  - url: https://discover.york.ac.uk/robots.txt
    observed_status: 404
    reality: 'the 404 is served with a 251 KB HTML body — status is honest, payload is not minimal'
