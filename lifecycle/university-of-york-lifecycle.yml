# authorship: generated by API Evangelist from live probes of the operator's own endpoints.
# The document is ours; the facts in it were measured, not claimed. `method: probed` below
# records HOW it was obtained; this header records WHO wrote it. An unmarked artifact would
# be credited to the institution as though they published it, and they did not.
specification: API Commons Lifecycle
specificationVersion: '0.1'
provider: University of York
providerId: university-of-york
generated: '2026-08-30'
method: probed
description: >-
  Versioning, change communication and deprecation posture for the University of York's
  institution-operated API surfaces. The honest summary is that there is no lifecycle programme:
  no changelog, no deprecation policy, no announced versions and no contact route dedicated to API
  consumers. What versioning exists is inherited from the open specifications the University
  deploys, which is a real and useful form of stability even though the University did not author it.
sources:
  - https://discover.york.ac.uk/about/
  - https://discover.york.ac.uk/iiif/3/ark:/36941/common/objects/uoy-logo/info.json
  - https://pure.york.ac.uk/ws/oai?verb=Identify
  - https://status.york.ac.uk/

surfaces:
  - name: University of York Digital Collections Search API
    versioning: none
    version_in_path: false
    version_header: none
    changelog: none
    deprecation_policy: none
    stability: >-
      Undocumented and unversioned. The response envelope is Elasticsearch's own, so a change of
      search engine would be a breaking change with no announcement channel. Field names carry
      UI-specific prefixes (ui_, aggs_) which signal that the shape is built for the site, not for
      third-party consumers, and may change with the site.
    risk: high

  - name: University of York Digital Collections IIIF APIs
    versioning: 'by specification version, in the path (/iiif/3/, /presentation/3/)'
    version_in_path: true
    changelog: none
    deprecation_policy: none
    stability: >-
      Strong by inheritance. IIIF Image API 3.0 and Presentation API 3.0 are stable published
      specifications with their own versioning discipline, and the major version is in the URI. A
      client written against IIIF will keep working; the risk sits in the identifiers, not the
      contract.
    risk: low

  - name: University of York Research Portal OAI-PMH
    versioning: 'protocolVersion 2.0, declared in the Identify response'
    version_in_path: false
    changelog: none
    deprecation_policy: none
    earliest_datestamp: '2014-10-14T11:47:31Z'
    deleted_record_policy: 'no'
    stability: >-
      OAI-PMH 2.0 has been stable since 2002 and the deployment declares it. Note the
      deletedRecord policy is "no" — this repository does NOT keep tombstones, so a harvester
      cannot learn that a record was withdrawn by harvesting incrementally; it must re-harvest in
      full to detect removals. That is a real operational constraint and it is declared honestly by
      the endpoint itself.
    risk: medium

institution_signals:
  status_page:
    url: https://status.york.ac.uk/
    status: 200
    covers: 'University IT services generally, not these APIs specifically'
  changelog: none
  developer_contact: none
  api_terms: none
  general_terms:
    url: https://www.york.ac.uk/about/legal-statements/
    status: 200
  note: >-
    No terms of use, licence or acceptable-use statement was found governing any of the three
    contracts in this repository. The IIIF manifests carry no rights or requiredStatement property,
    and the search API declares no licence. Reuse conditions for this material are therefore
    unstated, which is a governance gap worth naming rather than filling with an assumption.

retirement_observed:
  - name: University of York Library & Archives Digital Showcase
    url: https://digital.york.ac.uk/
    status: 200
    detail: >-
      Returns a maintenance page pointing at an Archive-It snapshot from 2025-04-03. A surface that
      existed and was withdrawn — recorded because a dead surface is a different fact from one that
      never existed.
