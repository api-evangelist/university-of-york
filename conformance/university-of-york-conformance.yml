# authorship: generated by API Evangelist from live probes of the operator's own endpoints.
# The document is ours; the facts in it were measured, not claimed. `method: probed` below
# records HOW it was obtained; this header records WHO wrote it. An unmarked artifact would
# be credited to the institution as though they published it, and they did not.
specification: API Evangelist Conformance
specificationVersion: '0.1'
provider: University of York
providerId: university-of-york
generated: '2026-08-30'
method: probed
description: >-
  Standards conformance the University of York's own, institution-operated surfaces actually
  demonstrate — each entry pinned to a live request and the exact location in the response that
  carries the evidence. Reward-only: a standard with no evidence is recorded as not_evidenced
  rather than omitted or asserted. Nothing here is inferred from a prose claim on a web page.
  Vendor-operated surfaces (Elsevier Pure's REST API, Ex Libris Primo, the White Rose EPrints
  consortium repositories) are excluded — their conformance belongs to their operators.
sources:
  - https://pure.york.ac.uk/ws/oai?verb=Identify
  - https://discover.york.ac.uk/iiif/3/ark:/36941/common/objects/uoy-logo/info.json
  - https://discover.york.ac.uk/ark:/36941/9952973300001381/presentation/3/manifest
  - https://shib.york.ac.uk/idp/profile/SAML2/Redirect/SSO

domain_regime: education

standards:
  - id: oai-pmh
    name: OAI-PMH 2.0 (Open Archives Initiative Protocol for Metadata Harvesting)
    status: conformant
    operator: institution
    surface: University of York Research Portal OAI-PMH
    contract: openapi/university-of-york-research-portal-oai-pmh-openapi.yml
    evidence:
      - url: https://pure.york.ac.uk/ws/oai?verb=Identify
        status: 200
        location: 'OAI-PMH/Identify/protocolVersion = "2.0"; repositoryName = "The University of York"; baseURL = "https://pure.york.ac.uk/ws/oai"; adminEmail = "pure-support@york.ac.uk"'
      - url: 'https://pure.york.ac.uk/ws/oai?verb=ListMetadataFormats'
        status: 200
        location: 'ListMetadataFormats: mods, xmetadiss, nl_didl, oai_dc, qdc'
      - url: 'https://pure.york.ac.uk/ws/oai?verb=ListSets'
        status: 200
        location: 'ListSets: persons:all, publications:all, publications:withFiles, publications:year{YYYY}'
      - url: 'https://pure.york.ac.uk/ws/oai?verb=ListIdentifiers&metadataPrefix=oai_dc'
        status: 200
        location: ListIdentifiers/header/identifier
      - url: 'https://pure.york.ac.uk/ws/oai?verb=ListRecords&metadataPrefix=oai_dc&set=publications:year1960'
        status: 200
        location: ListRecords/record (2 records returned)
      - url: 'https://pure.york.ac.uk/ws/oai?verb=BadVerb'
        status: 200
        location: 'error code="badVerb" — protocol error semantics confirmed'
    note: >-
      All six OAI-PMH 2.0 verbs confirmed live. The endpoint is on the University's own
      registrable domain and self-identifies as the University of York.

  - id: orcid
    name: ORCID researcher identifiers
    status: conformant
    operator: institution
    surface: University of York Research Portal OAI-PMH (mods metadata format)
    evidence:
      - url: 'https://pure.york.ac.uk/ws/oai?verb=GetRecord&metadataPrefix=mods&identifier=oai:https://pure.york.ac.uk/:publications/d5ff166f-d255-4cab-9688-253729e80ee0'
        status: 200
        location: '<mods:nameIdentifier type="orcid" typeURI="http://id.loc.gov/vocabulary/identifiers/orcid">0000-0001-5957-2474</mods:nameIdentifier> (and 0000-0002-7346-6560 on the same record)'
    note: >-
      ORCID iDs are emitted in the harvestable mods record, typed against the Library of Congress
      identifier vocabulary. They are NOT available through oai_dc on this deployment — there is no
      oai_dc_orcid metadata prefix here.

  - id: shibboleth
    name: Shibboleth Identity Provider
    status: partial
    operator: institution
    surface: University of York Shibboleth IdP (shib.york.ac.uk)
    evidence:
      - url: https://shib.york.ac.uk/idp/profile/SAML2/Redirect/SSO
        status: 400
        location: 'Shibboleth IdP error page ("Shibboleth - Error", University of York branded) returned by the SAML2 Redirect SSO profile endpoint — the software and the profile endpoint are confirmed present'
      - url: https://shib.york.ac.uk/idp/status
        status: 403
        location: Shibboleth IdP status handler present but access-restricted
      - url: https://shib.york.ac.uk/idp/profile/Metadata/SAML
        status: 200
        location: 'returns the Shibboleth error page, not SAML metadata — the metadata handler is not publicly served'
    note: >-
      The IdP is real, institution-operated and running Shibboleth, but it does not publish its
      SAML metadata from its own host; metadata is distributed through the UK Access Management
      Federation. Recorded as partial because the machine-readable artifact could not be retrieved
      from a University-controlled URL. This is a limit on the evidence, not a claim that it is
      absent from the federation.

  - id: saml
    name: SAML 2.0
    status: partial
    operator: institution
    surface: University of York Shibboleth IdP (shib.york.ac.uk)
    evidence:
      - url: https://shib.york.ac.uk/idp/profile/SAML2/Redirect/SSO
        status: 400
        location: SAML2 HTTP-Redirect SSO profile endpoint present and answering
    note: Same limit as shibboleth above — protocol endpoint confirmed, metadata document not publicly served.

  - id: datacite
    name: DataCite
    status: not_evidenced
    note: No DataCite-minted identifier or DataCite metadata schema was observed on any institution-operated surface.

  - id: crossref
    name: Crossref
    status: not_evidenced
    note: >-
      DOIs appear in the mods records (e.g. mods:identifier type="doi" 10.1111/j.1420-9101.2010.02038.x),
      but those are publisher-registered DOIs carried as references. The University does not mint them
      and no Crossref interface is operated here, so this is deliberately NOT recorded as conformance.

  - id: scim
    name: SCIM
    status: not_evidenced
  - id: lti
    name: IMS LTI
    status: not_evidenced
    note: A Blackboard VLE is live at vle.york.ac.uk, but it is vendor-operated and no LTI conformance surface is published on a University-controlled host.
  - id: oneroster
    name: IMS OneRoster
    status: not_evidenced
  - id: ed-fi
    name: Ed-Fi
    status: not_evidenced
    note: US K-12 data standard; not applicable to a UK university.
  - id: caliper
    name: IMS Caliper Analytics
    status: not_evidenced
  - id: qti
    name: IMS QTI
    status: not_evidenced

additional_standards:
  - id: iiif-image-api-3
    name: IIIF Image API 3.0
    status: conformant
    compliance_level: level2
    operator: institution
    contract: openapi/university-of-york-digital-collections-iiif-openapi.yml
    evidence:
      - url: https://discover.york.ac.uk/iiif/3/ark:/36941/common/objects/uoy-logo/info.json
        status: 200
        location: '"@context": "http://iiif.io/api/image/3/context.json"; "type": "ImageService3"; "protocol": "http://iiif.io/api/image"; "profile": "level2"'
      - url: https://discover.york.ac.uk/iiif/3/ark:/36941/common/objects/uoy-logo/full/max/0/default.jpg
        status: 200
        location: image/jpeg returned for a canonical IIIF image request
  - id: iiif-presentation-api-3
    name: IIIF Presentation API 3.0
    status: conformant
    operator: institution
    contract: openapi/university-of-york-digital-collections-iiif-openapi.yml
    evidence:
      - url: https://discover.york.ac.uk/ark:/36941/9952973300001381/presentation/3/manifest
        status: 200
        location: '"@context": "http://iiif.io/api/presentation/3/context.json"; "type": "Manifest"; 7 Canvas items'
      - url: https://discover.york.ac.uk/ark:/36941/796351/presentation/3/canvas/802563
        status: 200
        location: Canvas resource served independently of its manifest
    gap: >-
      The IIIF Collection endpoint (/ark:/{naan}/{id}/presentation/3/collection) returns 403 and
      appears not to be deployed, so there is no machine-readable entry point that lists the
      collections. A harvester must start from the search API or from HTML.
  - id: ark
    name: ARK persistent identifiers
    status: conformant
    operator: institution
    evidence:
      - url: https://discover.york.ac.uk/api/search-simple?q=york&size=1
        status: 200
        location: 'every hit _id is an ARK under NAAN 36941, e.g. ark:/36941/806938/objects/17061'
    gap: >-
      ARKs are used as identifiers throughout, but ark:/36941/{id} does not resolve server-side on
      discover.york.ac.uk — the request returns the single-page-application HTML 404 shell.
      Identifier syntax is adopted; identifier resolution is not.
  - id: dublin-core
    name: Dublin Core (oai_dc)
    status: conformant
    operator: institution
    evidence:
      - url: 'https://pure.york.ac.uk/ws/oai?verb=GetRecord&metadataPrefix=oai_dc&identifier=oai:https://pure.york.ac.uk/:publications/d5ff166f-d255-4cab-9688-253729e80ee0'
        status: 200
        location: oai_dc:dc element set with dc:title, dc:creator, dc:subject, dc:identifier
  - id: mods
    name: MODS 3.8
    status: conformant
    operator: institution
    evidence:
      - url: 'https://pure.york.ac.uk/ws/oai?verb=ListMetadataFormats'
        status: 200
        location: 'metadataPrefix "mods", schema http://www.loc.gov/mods/v3/mods-3-8.xsd'
  - id: json-ld
    name: JSON-LD
    status: conformant
    operator: institution
    evidence:
      - url: https://discover.york.ac.uk/iiif/3/ark:/36941/common/objects/uoy-logo/info.json
        status: 200
        location: served as application/ld+json with an @context
